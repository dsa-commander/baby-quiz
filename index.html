<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --navy: #1B2A4A;
    --navy-deep: #121E38;
    --cream: #F7F1E3;
    --gold: #E0A93D;
    --gold-dim: #B7872E;
    --sage: #93A97E;
    --coral: #D9705F;
    --ink: #1B2A4A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--navy-deep);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(224,169,61,0.10) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(147,169,126,0.10) 0%, transparent 45%);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--cream);
    color: var(--ink);
    border-radius: 18px;
    padding: 32px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 18px, var(--sage) 18px 36px, var(--coral) 36px 54px);
  }

  .lang-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }
  .lang-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 2px solid #DCD3BC;
    background: #FFFDF8;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .lang-btn.active {
    background: var(--navy);
    color: var(--cream);
    border-color: var(--navy);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.15;
    margin: 10px 0 6px;
  }

  .subtitle {
    font-size: 15px;
    color: #55618A;
    margin-bottom: 26px;
    line-height: 1.5;
  }

  input[type=text] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid #DCD3BC;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 16px;
    background: #FFFDF8;
  }
  input[type=text]:focus { outline: none; border-color: var(--gold-dim); }

  button.primary {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: var(--navy);
    color: var(--cream);
    font-size: 16px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.4; cursor: default; }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    color: #55618A;
    margin-bottom: 18px;
  }

  .progress-bar {
    height: 6px;
    background: #E9E1CC;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.25s ease;
  }

  .question {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.35;
    margin-bottom: 20px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid #DCD3BC;
    background: #FFFDF8;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:active { transform: scale(0.99); }
  .option.correct { border-color: var(--sage); background: #EAF0E3; }
  .option.wrong { border-color: var(--coral); background: #F7E5E1; }
  .option.disabled { pointer-events: none; }

  .result-score {
    font-family: 'Fraunces', serif;

    font-weight: 700;
    text-align: center;
    margin: 6px 0 4px;
    color: var(--navy);

    color: #55618A;
    font-size: 14px;
    margin-bottom: 24px;

  .leaderboard {

    display: flex;

let lang = 'en';
let currentQ = 0;
let score = 0;
let playerName = "";
let answered = false;
let selectedDate = null;

function todayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateLabel(dateKey) {
  if (dateKey === todayKey()) return t().today;
  const [y, m, d] = dateKey.split('-').map(Number);
  const dateObj = new Date(y, m - 1, d);
  return dateObj.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

const screenStart = document.getElementById('screen-start');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');

function t() { return UI[lang]; }

function applyStaticText() {
  const u = t();
  document.getElementById('html-root').lang = lang;
  document.getElementById('t-title').textContent = u.title;
  document.getElementById('t-subtitle').textContent = u.subtitle;
  document.getElementById('name-input').placeholder = u.namePlaceholder;
  document.getElementById('start-btn').textContent = u.startBtn;
  document.getElementById('t-leaderboard-so-far').textContent = u.leaderboardSoFar;
  document.getElementById('t-nice-work').textContent = u.niceWork;
  document.getElementById('retry-btn').textContent = u.playAgain;
  document.getElementById('t-leaderboard').textContent = u.leaderboard;
  populateDateSelectors();
  if (!screenQuiz.classList.contains('hidden')) {
    renderQuestion();
  }
}

function setLang(newLang) {
  lang = newLang;
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-de').classList.toggle('active', lang === 'de');
  applyStaticText();
  refreshLeaderboards();
}

document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
document.getElementById('lang-de').addEventListener('click', () => setLang('de'));

document.getElementById('start-btn').addEventListener('click', () => {
  const val = document.getElementById('name-input').value.trim();
  playerName = val || (lang === 'de' ? "Gast" : "Guest");
  currentQ = 0;
  score = 0;
  screenStart.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  renderQuestion();
});

function renderQuestion() {
  answered = false;
  const total = QUESTIONS.length;
  const item = QUESTIONS[currentQ][lang];
  document.getElementById('q-counter').textContent = t().questionOf(currentQ + 1, total);
  document.getElementById('q-score').textContent = t().score(score);
  document.getElementById('progress-fill').style.width = `${(currentQ / total) * 100}%`;
  document.getElementById('q-text').textContent = item.q;

  const optionsEl = document.getElementById('q-options');
  optionsEl.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx, btn));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(idx, btnEl) {
  if (answered) return;
  answered = true;
  const correctIdx = QUESTIONS[currentQ].correct;
  const allBtns = document.querySelectorAll('#q-options .option');
  allBtns.forEach(b => b.classList.add('disabled'));

  if (idx === correctIdx) {
    score++;
    btnEl.classList.add('correct');
  } else {
    btnEl.classList.add('wrong');
    allBtns[correctIdx].classList.add('correct');
  }
  document.getElementById('q-score').textContent = t().score(score);

  setTimeout(() => {
    currentQ++;
    if (currentQ < QUESTIONS.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 900);
}

function showResult() {
  screenQuiz.classList.add('hidden');
  screenResult.classList.remove('hidden');
  document.getElementById('progress-fill').style.width = '100%';
  const total = QUESTIONS.length;
  document.getElementById('final-score').textContent = `${score} / ${total}`;
  const pct = score / total;
  const labels = t().labels;
  let label;
  if (pct === 1) label = labels.perfect;
  else if (pct >= 0.8) label = labels.great;
  else if (pct >= 0.5) label = labels.solid;
  else label = labels.room;
  document.getElementById('final-label').textContent = label;
  saveScore();
}

function saveScore() {
  try {
    db.ref('scores/' + todayKey()).push({ name: playerName, score, total: QUESTIONS.length, ts: Date.now() });
  } catch (err) {
    console.error('Could not save score', err);
  }
}

document.getElementById('retry-btn').addEventListener('click', () => {
  screenResult.classList.add('hidden');
  screenStart.classList.remove('hidden');
});

let scoresByDate = {};

function renderLeaderboard(entries, targetId) {
  const el = document.getElementById(targetId);
  if (!entries || !entries.length) {
    el.innerHTML = `<div class="loading-note">${t().noScores}</div>`;
    return;
  }
  const sorted = [...entries].sort((a, b) => b.score - a.score || a.ts - b.ts);
  el.innerHTML = sorted.slice(0, 10).map(en => `
    <div class="lb-row">
      <span class="lb-name">${escapeHtml(en.name)}${en.name === playerName ? `<span class="lb-you">${t().you}</span>` : ''}</span>
      <span class="lb-score">${en.score} / ${en.total}</span>
    </div>
  `).join('');
}

function populateDateSelectors() {
  const keys = Object.keys(scoresByDate);
  if (!keys.includes(todayKey())) keys.push(todayKey());
  keys.sort().reverse();
  if (!selectedDate || !keys.includes(selectedDate)) selectedDate = todayKey();

  [ 'date-select-start', 'date-select-final' ].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = keys.map(k => `<option value="${k}"${k === selectedDate ? ' selected' : ''}>${formatDateLabel(k)}</option>`).join('');
  });
}

function refreshLeaderboards() {
  const entries = scoresByDate[selectedDate] || [];
  renderLeaderboard(entries, 'start-leaderboard');
  renderLeaderboard(entries, 'final-leaderboard');
}

function onDateChange(newDate) {
  selectedDate = newDate;
  populateDateSelectors();
  refreshLeaderboards();
}

document.getElementById('date-select-start').addEventListener('change', e => onDateChange(e.target.value));
document.getElementById('date-select-final').addEventListener('change', e => onDateChange(e.target.value));

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('start-leaderboard').innerHTML = `<div class="loading-note">${t().loading}</div>`;
document.getElementById('final-leaderboard').innerHTML = `<div class="loading-note">${t().loading}</div>`;

try {
  db.ref('scores').on('value', snap => {
    const byDate = {};
    snap.forEach(dateSnap => {
      const dayEntries = [];
      dateSnap.forEach(child => { dayEntries.push(child.val()); return false; });
      byDate[dateSnap.key] = dayEntries;
      return false;
    });
    scoresByDate = byDate;
    populateDateSelectors();
    refreshLeaderboards();
  });
} catch (err) {
  console.error('Leaderboard unavailable', err);
}

applyStaticText();
</script>

</body>
</html>
